name: boilerplate
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # dependency injection
  get_it: ^9.2.1

  # functional error handling
  fpdart: ^1.2.0

  # models / unions
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # network
  dio: ^5.11.0
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0

  # local database
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # Direct because guard maps the database driver's SqliteException.
  sqlite3: 3.5.1

  # routing
  go_router: ^17.5.0

  # storage
  # hive 2.2.3 is unmaintained, but it is used WITHOUT hive_generator here —
  # no TypeAdapters, no codegen — so there is no generator to rot against
  # future analyzer/build_runner releases. `hive_ce` is the maintained
  # community fork and a near drop-in if that changes.
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1

  # ui
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  another_flushbar: ^2.2.4

  # utils
  intl: ^0.20.2
  logger: ^2.7.0
  rxdart: ^0.28.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mockito: ^5.6.4
  http_mock_adapter: ^0.6.1

  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8
  drift_dev: ^2.34.0
  intl_utils: ^2.8.14
  # Pinned exactly: 5.15.0 silently stops emitting lib/generated/assets.gen.dart
  # (no error, just a missing file and undefined-name errors at the use sites).
  flutter_gen_runner: 5.13.0+1

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true

flutter_intl:
  enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
