name: Flutter CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      # Bakes .env.dev, which is what the analyzer, the tests, and a clean
      # checkout all expect. The production build below re-runs codegen
      # against .env.production before it builds.
      - name: Install dependencies and generate
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test and enforce authored coverage
        shell: bash
        run: |
          DEVICE_ID="$(
            xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries | sort_by(.key)[] | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | sort_by(.name, .udid) | .[0].udid'
          )"
          test -n "$DEVICE_ID" && test "$DEVICE_ID" != "null"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          make coverage FLUTTER=flutter DART=dart COVERAGE_DEVICE="$DEVICE_ID"

      # `make env_production` is not optional here: a --flavor production
      # build compiled against .env.dev would produce a production-signed,
      # production-named APK carrying development configuration. AppConfig
      # refuses to start in that state, so getting the order wrong fails at
      # launch rather than shipping.
      - name: Build production APK
        run: make build_apk_production FLUTTER=flutter DART=dart

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk

      # The obfuscation map is the only way to read a crash report from this
      # APK back into symbols. It is useless later if it is not kept now.
      - uses: actions/upload-artifact@v4
        with:
          name: production-debug-symbols
          path: build/symbols/production
