name: Flutter CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies and generate
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run build_runner build

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test and enforce authored coverage
        shell: bash
        run: |
          DEVICE_ID="$(
            xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries | sort_by(.key)[] | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | sort_by(.name, .udid) | .[0].udid'
          )"
          test -n "$DEVICE_ID" && test "$DEVICE_ID" != "null"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          make coverage FLUTTER=flutter DART=dart COVERAGE_DEVICE="$DEVICE_ID"

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
